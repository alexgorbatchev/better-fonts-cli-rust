[package]
name = "better-fonts-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Stage and apply custom fonts to macOS application bundles"

[[bin]]
name = "better-fonts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["string"] }
clap_complete = "4.6"
cli-command-kit = { path = "../cli-command-kit" }
cli-deps = { path = "../deps" }
dirs = "6"
libc = "0.2"
plist = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
toml = "1.1"
xattr = "1.6"

[profile.dev]
debug = 0
[profile.test]
debug = 0
